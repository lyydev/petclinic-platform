apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: petclinic-prod

resources:
  - namespace.yaml
  - ../../base
  - resource-quota.yaml
  - pdb.yaml
  - hpa.yaml

images:
  - name: 037547369073.dkr.ecr.us-east-1.amazonaws.com/petclinic/config-server
    newName: 037547369073.dkr.ecr.us-east-1.amazonaws.com/petclinic-prod/config-server
    newTag: 635f8be
  - name: 037547369073.dkr.ecr.us-east-1.amazonaws.com/petclinic/discovery-server
    newName: 037547369073.dkr.ecr.us-east-1.amazonaws.com/petclinic-prod/discovery-server
    newTag: 635f8be
  - name: 037547369073.dkr.ecr.us-east-1.amazonaws.com/petclinic/customers-service
    newName: 037547369073.dkr.ecr.us-east-1.amazonaws.com/petclinic-prod/customers-service
    newTag: 635f8be
  - name: 037547369073.dkr.ecr.us-east-1.amazonaws.com/petclinic/visits-service
    newName: 037547369073.dkr.ecr.us-east-1.amazonaws.com/petclinic-prod/visits-service
    newTag: 635f8be
  - name: 037547369073.dkr.ecr.us-east-1.amazonaws.com/petclinic/vets-service
    newName: 037547369073.dkr.ecr.us-east-1.amazonaws.com/petclinic-prod/vets-service
    newTag: 635f8be
  - name: 037547369073.dkr.ecr.us-east-1.amazonaws.com/petclinic/genai-service
    newName: 037547369073.dkr.ecr.us-east-1.amazonaws.com/petclinic-prod/genai-service
    newTag: 635f8be
  - name: 037547369073.dkr.ecr.us-east-1.amazonaws.com/petclinic/api-gateway
    newName: 037547369073.dkr.ecr.us-east-1.amazonaws.com/petclinic-prod/api-gateway
    newTag: 635f8be
  - name: 037547369073.dkr.ecr.us-east-1.amazonaws.com/petclinic/admin-server
    newName: 037547369073.dkr.ecr.us-east-1.amazonaws.com/petclinic-prod/admin-server
    newTag: 635f8be

patches:
  - path: replicas-patch.yaml
  - target:
      kind: ExternalSecret
      name: rds-credentials
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: petclinic/prod/rds-credentials
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: petclinic/prod/rds-credentials
  - target:
      kind: ExternalSecret
      name: openai-api-key
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: petclinic/prod/openai-api-key
  - target:
      kind: Ingress
      name: api-gateway-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: petclinic.k8s.lyaistorm.win
      - op: replace
        path: /metadata/annotations/alb.ingress.kubernetes.io~1group.name
        value: petclinic-prod
  - target:
      kind: ConfigMap
      name: customers-service-config
    patch: |-
      - op: replace
        path: /data/SPRING_DATASOURCE_URL
        value: jdbc:mysql://petclinic-prod-mysql.rds.us-east-1.amazonaws.com:3306/petclinic
  - target:
      kind: ConfigMap
      name: visits-service-config
    patch: |-
      - op: replace
        path: /data/SPRING_DATASOURCE_URL
        value: jdbc:mysql://petclinic-prod-mysql.rds.us-east-1.amazonaws.com:3306/petclinic
  - target:
      kind: ConfigMap
      name: vets-service-config
    patch: |-
      - op: replace
        path: /data/SPRING_DATASOURCE_URL
        value: jdbc:mysql://petclinic-prod-mysql.rds.us-east-1.amazonaws.com:3306/petclinic
