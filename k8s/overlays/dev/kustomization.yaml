apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: petclinic-dev

resources:
  - ../../base/ingress

patches:
  - target:
      kind: Ingress
      name: api-gateway-ingress
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: petclinic-dev.k8s.lyaistorm.win
