# Production environment Helm overrides
# Story: PETPLAT-109
# Merged after per-service values: -f helm-values/{service}.yaml -f helm-values/prod.yaml

environment: prod
namespace: petclinic-prod

# Default fallback for newly added domain services; exact per-service settings are in services below
replicaCount: 2

image:
  registry: 037547369073.dkr.ecr.us-east-1.amazonaws.com/petclinic-prod
  pullPolicy: Always

datasource:
  url: "jdbc:mysql://petclinic-prod-mysql.rds.us-east-1.amazonaws.com:3306/petclinic"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Exact per-service production replica counts, HPA targets, and PDB settings
# matching k8s/overlays/prod/ (replicas-patch.yaml, hpa.yaml, pdb.yaml)
services:
  config-server:
    replicaCount: 2
    autoscaling:
      enabled: false
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  discovery-server:
    replicaCount: 2
    autoscaling:
      enabled: false
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  api-gateway:
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  customers-service:
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  visits-service:
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  vets-service:
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  genai-service:
    replicaCount: 1
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: false

  admin-server:
    replicaCount: 1
    autoscaling:
      enabled: false
    podDisruptionBudget:
      enabled: false
