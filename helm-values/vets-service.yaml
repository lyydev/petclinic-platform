# Per-service Helm values for vets-service
# Story: PETPLAT-108

nameOverride: vets-service
fullnameOverride: vets-service
component: service

image:
  name: vets-service
  repository: 037547369073.dkr.ecr.us-east-1.amazonaws.com/petclinic-dev/vets-service
  tag: "635f8be"
  pullPolicy: Always

containerPort: 8083

service:
  type: ClusterIP
  port: 8083

springProfiles: "docker,mysql"

configMap:
  enabled: true
  data:
    CONFIG_SERVER_URL: "http://config-server:8888"
    DISCOVERY_SERVER_URL: "http://discovery-server:8761/eureka"
    SPRING_DATASOURCE_URL: "{{ .Values.datasource.url }}"

env: []

secrets:
  - name: SPRING_DATASOURCE_USERNAME
    secretName: rds-credentials
    key: username
  - name: SPRING_DATASOURCE_PASSWORD
    secretName: rds-credentials
    key: password

initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - until wget -qO- http://config-server:8888/actuator/health; do sleep 5; done
  - name: wait-for-discovery-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - until wget -qO- http://discovery-server:8761/actuator/health; do sleep 5; done

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  startup:
    enabled: true
    path: /actuator/health
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  readiness:
    enabled: true
    path: /actuator/health/readiness
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    enabled: true
    path: /actuator/health/liveness
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
