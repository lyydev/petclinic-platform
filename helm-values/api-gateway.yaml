# Per-service Helm values for api-gateway
# Story: PETPLAT-108

nameOverride: api-gateway
fullnameOverride: api-gateway
component: gateway

image:
  name: api-gateway
  repository: 037547369073.dkr.ecr.us-east-1.amazonaws.com/petclinic-dev/api-gateway
  tag: "v1.0.0"
  pullPolicy: Always

containerPort: 8080

service:
  type: ClusterIP
  port: 8080

springProfiles: "docker"

configMap:
  enabled: true
  data:
    CONFIG_SERVER_URL: "http://config-server:8888"
    DISCOVERY_SERVER_URL: "http://discovery-server:8761/eureka"

env: []
secrets: []

initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - until wget -qO- http://config-server:8888/actuator/health; do sleep 5; done
  - name: wait-for-discovery-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - until wget -qO- http://discovery-server:8761/actuator/health; do sleep 5; done

# API Gateway handles all external traffic routing — higher CPU allocation
resources:
  requests:
    cpu: 200m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

probes:
  startup:
    enabled: true
    path: /actuator/health
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  readiness:
    enabled: true
    path: /actuator/health/readiness
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    enabled: true
    path: /actuator/health/liveness
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
